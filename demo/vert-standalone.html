<title>Vert Command Board</title>
<style>
:root{
  --rail:#0A0A0A; --rail-raised:#1B1B1E; --canvas:#FCFCFD; --ink:#111114; --muted:#6B6B76; --faint:#9A9AA5; --line:#E8E8EE;
  --accent:#5B2EE8; --accent-ink:#4A22C8; --accent-soft:#F2EEFE; --accent-line:#DCD2FB;
  --white:#FFFFFF; --neutral-50:#FAFAFA; --neutral-100:#F5F5F5; --neutral-200:#E5E5E5; --neutral-300:#D4D4D4;
  --red:#DC2626; --red-600:#DC2626; --red-soft:#FEF2F2; --red-line:#FECACA; --red-ink:#991B1B; --red-700:#B91C1C;
  --emerald:#059669; --emerald-500:#10B981; --emerald-soft:#ECFDF5; --emerald-ink:#047857; --emerald-200:#A7F3D0;
  --blue:#2563EB;
  --shadow-card:0 1px 2px rgba(17,17,20,.04);
  --shadow-lift:0 8px 28px rgba(17,17,20,.10);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ /* Vert ships light-only; tokens intentionally unchanged */ } }
:root[data-theme="dark"]{ /* Vert ships light-only; tokens intentionally unchanged */ }

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--canvas); color:var(--ink); font-family:var(--font);
  font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; }
a{ color:inherit; text-decoration:none; }
.tnum{ font-variant-numeric:tabular-nums; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
svg{ display:block; }
.icon{ flex-shrink:0; }
.spin{ animation:spin 0.9s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.pulse{ animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
.line-clamp-3{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.line-clamp-4{ display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.scroll-thin::-webkit-scrollbar{ height:8px; width:8px; }
.scroll-thin::-webkit-scrollbar-thumb{ background:var(--neutral-200); border-radius:8px; }

#app{ display:flex; min-height:100vh; width:100%; }

/* ---------------- sidebar ---------------- */
.sidebar{
  position:sticky; top:0; height:100vh; width:248px; flex:0 0 248px;
  background:var(--rail); color:#fff; display:flex; flex-direction:column; z-index:60;
}
.sb-mark{ display:flex; align-items:center; gap:12px; padding:22px 24px 20px; }
.sb-glyph{ position:relative; width:36px; height:36px; border-radius:999px; overflow:hidden; flex:0 0 36px;
  background:radial-gradient(circle at 30% 25%,#f4f4f6,#8b8b93 45%,#1d1d21 75%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
.sb-glyph i{ position:absolute; left:50%; top:56%; transform:translate(-50%,-50%); width:16px; height:14px; background:#0A0A0A; clip-path:polygon(50% 0,100% 100%,0 100%); }
.sb-word{ font-size:24px; font-weight:500; letter-spacing:-.02em; }
.sb-nav{ display:flex; flex-direction:column; gap:2px; padding:0 12px; }
.sb-item{ display:flex; width:100%; align-items:center; gap:12px; border-radius:12px; padding:10px 14px; font-size:14.5px; color:rgba(255,255,255,.6); text-align:left; transition:background .12s,color .12s; }
.sb-item:hover{ background:rgba(255,255,255,.04); color:#fff; }
.sb-item.on{ background:var(--rail-raised); color:#fff; font-weight:500; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
.sb-rule{ margin:16px 20px; border-top:1px solid rgba(255,255,255,.1); }
.sb-groups{ flex:1; overflow-y:auto; padding:0 12px 16px; }
.sb-group-head{ display:flex; width:100%; align-items:center; gap:12px; border-radius:12px; padding:10px 14px; font-size:14.5px; color:rgba(255,255,255,.6); }
.sb-group-head:hover{ color:#fff; }
.sb-group-head .chev{ margin-left:auto; transition:transform .15s; }
.sb-group-head .chev.shut{ transform:rotate(-90deg); }
.sb-kids{ margin:2px 0 8px 27px; padding-left:14px; border-left:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; }
.sb-kids button{ text-align:left; padding:7px 10px; border-radius:8px; font-size:14px; color:rgba(255,255,255,.55); }
.sb-kids button:hover{ color:#fff; }
.sb-foot{ padding:0 16px 20px; }
.sb-newchat{ margin-bottom:20px; display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:#fff; padding:12px; font-size:14.5px; font-weight:500; color:var(--ink); box-shadow:var(--shadow-card); }
.sb-newchat:hover{ background:rgba(255,255,255,.9); }
.sb-who{ display:flex; align-items:center; gap:12px; border-top:1px solid rgba(255,255,255,.1); padding-top:16px; }
.sb-avatar{ display:flex; height:40px; width:40px; flex:0 0 40px; align-items:center; justify-content:center; border-radius:999px; background:linear-gradient(to bottom right,#8a7564,#3a322c); font-size:13px; font-weight:600; box-shadow:0 0 0 2px rgba(255,255,255,.1); }
.sb-whoname{ display:block; font-size:14px; font-weight:500; }
.sb-whorole{ display:block; font-size:12px; color:rgba(255,255,255,.5); }
.sb-backdrop{ display:none; }
.sb-hamburger{ display:none; }

@media (max-width:900px){
  .sidebar{ position:fixed; inset:0 auto 0 0; transform:translateX(-100%); transition:transform .2s ease; width:250px; }
  .sidebar.open{ transform:translateX(0); box-shadow:var(--shadow-lift); }
  .sb-backdrop{ display:none; position:fixed; inset:0; background:rgba(10,10,10,.35); z-index:55; }
  .sb-backdrop.show{ display:block; }
  .sb-hamburger{ display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:#fff; flex:0 0 auto; }
}

/* ---------------- command / header ---------------- */
.main{ flex:1; min-width:0; }
.command{ max-width:1240px; margin:0 auto; padding:28px 32px 40px; }
.cmd-top{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.cmd-hello{ display:flex; align-items:center; gap:10px; font-size:28px; font-weight:500; letter-spacing:-.02em; min-width:0; }
.cmd-actions{ display:flex; flex-shrink:0; align-items:center; gap:12px; }
.btn-line{ display:flex; align-items:center; gap:8px; border-radius:12px; border:1px solid var(--line); background:#fff; padding:10px 16px; font-size:14px; font-weight:500; box-shadow:var(--shadow-card); white-space:nowrap; }
.btn-line:hover{ border-color:var(--accent-line); }
.askbar{ display:flex; align-items:center; gap:12px; border-radius:16px; border:1px solid var(--line); background:#fff; padding:16px 20px; box-shadow:var(--shadow-card); margin-bottom:24px; }
.askbar:focus-within{ border-color:var(--accent-line); }
.askbar input{ flex:1; min-width:0; border:0; background:transparent; outline:none; font-size:15px; }
.askbar input::placeholder{ color:var(--faint); }
.askbar button{ border-radius:8px; padding:6px; color:var(--accent); }
.askbar button:hover{ background:var(--accent-soft); }

/* ---------------- board ---------------- */
.board{ display:flex; align-items:flex-start; gap:12px; overflow-x:auto; padding-bottom:24px; }
.column{ display:flex; width:300px; flex:0 0 300px; flex-direction:column; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.6); transition:border-color .12s,background .12s; min-height:60px; }
.column.over{ border-color:var(--accent-line); background:rgba(242,238,254,.4); }
.col-head{ display:flex; align-items:center; gap:8px; padding:14px 16px 12px; }
.col-dot{ width:7px; height:7px; border-radius:999px; }
.col-dot.red{ background:#ef4444; } .col-dot.green{ background:var(--emerald-500); } .col-dot.gray{ background:var(--neutral-300); }
.col-title{ font-size:14px; font-weight:500; }
.col-count{ border-radius:6px; background:var(--neutral-100); padding:2px 6px; font-size:11.5px; font-weight:500; color:var(--muted); }
.col-body{ display:flex; flex-direction:column; gap:10px; padding:0 10px 12px; min-height:20px; }

.card{ position:relative; border-radius:12px; border:1px solid var(--line); background:#fff; box-shadow:var(--shadow-card); transition:box-shadow .12s,border-color .12s; cursor:grab; }
.card:hover{ border-color:var(--neutral-300); box-shadow:var(--shadow-lift); }
.card.dragging{ opacity:.5; }
.card-link{ display:block; padding:14px; }
.card-head{ display:flex; align-items:center; justify-content:between; gap:8px; margin-bottom:8px; }
.card-time{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.dot-live{ width:7px; height:7px; border-radius:999px; background:var(--emerald-500); }
.card-title{ font-size:14px; font-weight:500; line-height:1.35; }
.card-client{ margin-top:3px; font-size:12.5px; color:var(--muted); }
.card-clar{ display:inline-flex; margin-top:8px; border-radius:6px; background:var(--accent-soft); padding:2px 8px; font-size:11.5px; font-weight:500; color:var(--accent); }
.card-prog{ display:flex; align-items:flex-start; gap:8px; margin-top:10px; }
.ring{ flex:0 0 16px; margin-top:1px; transform:rotate(-90deg); }
.card-desc{ font-size:12px; line-height:1.5; color:rgba(17,17,20,.7); }
.card-descbar{ margin-top:7px; height:4px; flex:1; border-radius:999px; background:var(--neutral-100); }
.card-files{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
.card-file{ display:flex; align-items:center; gap:8px; }
.filechip{ display:flex; flex:0 0 auto; align-items:center; justify-content:center; border-radius:3px; font-weight:700; color:#fff; }
.filechip.sm{ width:13px; height:15px; font-size:8px; }
.filechip.md{ width:24px; height:28px; border-radius:6px; font-size:11px; }
.chip-xlsx{ background:#059669; } .chip-pdf{ background:#dc2626; } .chip-docx{ background:#2563eb; }
.card-filename{ font-size:12px; color:rgba(17,17,20,.7); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-grip{ position:absolute; right:10px; top:12px; display:flex; gap:5px; padding:2px; opacity:.55; }
.grip-dots{ display:flex; flex-direction:column; gap:3px; }
.grip-dots i{ width:3px; height:3px; border-radius:999px; background:#a3a3a3; display:block; }

/* ---------------- new workflow dialog ---------------- */
.overlay{ position:fixed; inset:0; z-index:200; display:flex; justify-content:center; background:rgba(17,17,20,.25); padding:9vh 16px 16px; overflow-y:auto; }
.dialog{ width:100%; max-width:640px; border-radius:16px; border:1px solid var(--line); background:#fff; box-shadow:var(--shadow-lift); overflow:hidden; max-height:82vh; display:flex; flex-direction:column; }
.dialog-head{ display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding:16px 24px; flex:0 0 auto; }
.dialog-title{ flex:1; font-size:16px; font-weight:500; }
.dialog-x{ border-radius:8px; padding:6px; color:var(--faint); }
.dialog-x:hover{ background:var(--neutral-100); }
.dialog-body{ overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:16px; }
.field label{ display:block; margin-bottom:6px; font-size:12.5px; font-weight:500; color:var(--muted); }
.field input,.field select,.field textarea{ width:100%; border-radius:12px; border:1px solid var(--line); padding:10px 14px; font-size:14px; outline:none; }
.field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--accent); }
.field textarea{ resize:none; line-height:1.5; }
.grid2{ display:grid; grid-template-columns:1fr 200px; gap:12px; }
@media (max-width:520px){ .grid2{ grid-template-columns:1fr; } }
.examples{ display:flex; flex-wrap:wrap; gap:8px; }
.example-chip{ border-radius:999px; border:1px solid var(--line); padding:5px 12px; font-size:12.5px; color:var(--muted); }
.example-chip:hover{ border-color:var(--accent-line); color:var(--accent); }
.dropzone{ display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:12px; border:1px dashed var(--accent-line); background:rgba(242,238,254,.5); padding:16px; font-size:13.5px; color:var(--accent); }
.dropzone:hover{ background:var(--accent-soft); }
.filelist{ margin-top:8px; display:flex; flex-direction:column; gap:4px; }
.filelist li{ display:flex; align-items:center; gap:8px; font-size:13px; color:rgba(17,17,20,.8); }
.proposal{ border-radius:12px; border:1px solid var(--line); background:rgba(250,250,250,.6); padding:16px; }
.proposal-steps{ display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none; }
.proposal-steps li{ display:flex; gap:10px; }
.step-num{ margin-top:2px; display:flex; flex:0 0 18px; height:18px; align-items:center; justify-content:center; border-radius:999px; border:1px solid var(--line); font-size:10px; color:var(--muted); }
.proposal-needs{ margin:4px 0 0; padding:0; list-style:none; font-size:13px; color:var(--muted); }
.dialog-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--line); background:rgba(250,250,250,.6); padding:14px 24px; flex:0 0 auto; flex-wrap:wrap; }
.hint{ font-size:12px; color:var(--faint); }
.btn-accent{ display:flex; align-items:center; gap:8px; border-radius:12px; background:var(--accent); padding:10px 18px; font-size:13.5px; font-weight:500; color:#fff; }
.btn-accent:hover{ background:var(--accent-ink); }
.btn-accent:disabled{ opacity:.4; cursor:not-allowed; }
.btn-ghost{ border-radius:12px; border:1px solid var(--line); padding:10px 18px; font-size:14px; color:var(--ink); }
.btn-ghost:hover{ background:var(--neutral-50); }

/* ---------------- workflow page ---------------- */
.wf-shell{ display:flex; min-height:100vh; }
.wf-main{ min-width:0; flex:1; }
.wf-header{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.92); backdrop-filter:blur(6px); padding:14px 20px; flex-wrap:wrap; }
.wf-back{ border-radius:8px; padding:6px; color:var(--muted); }
.wf-back:hover{ background:var(--neutral-100); color:var(--ink); }
.wf-crumb{ display:flex; min-width:0; align-items:center; gap:8px; font-size:14.5px; }
.wf-crumb a{ color:var(--muted); } .wf-crumb a:hover{ color:var(--ink); }
.wf-crumb .sep{ color:var(--faint); }
.wf-crumb .cur{ font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:36vw; }
.pill{ flex:0 0 auto; border-radius:6px; padding:2px 9px; font-size:12.5px; font-weight:500; }
.pill-accent{ background:var(--accent-soft); color:var(--accent); }
.pill-green{ background:var(--emerald-soft); color:var(--emerald-ink); }
.pill-red{ background:var(--red-soft); color:var(--red-ink); }
.pill-gray{ background:var(--neutral-100); color:var(--muted); }
.wf-spacer{ margin-left:auto; display:flex; flex:0 0 auto; align-items:center; gap:8px; }
.iconbtn{ border-radius:10px; border:1px solid var(--line); padding:8px; color:var(--muted); }
.iconbtn:hover{ background:var(--neutral-50); }
.menu-wrap{ position:relative; }
.menu{ position:absolute; right:0; top:44px; z-index:30; width:210px; border-radius:12px; border:1px solid var(--line); background:#fff; padding:4px; box-shadow:var(--shadow-lift); }
.menu button{ width:100%; border-radius:8px; padding:8px 12px; text-align:left; font-size:13.5px; }
.menu button:hover{ background:var(--neutral-50); }
.menu button.danger{ color:var(--red-600); }
.menu button.danger:hover{ background:var(--red-soft); }
.wf-body{ max-width:900px; margin:0 auto; padding:32px; }

.blocker{ margin-bottom:28px; display:flex; gap:12px; border-radius:16px; border:1px solid var(--red-line); background:rgba(254,242,242,.7); padding:20px; }
.blocker h2{ margin:0; font-size:15px; font-weight:500; color:var(--red-ink); }
.blocker p{ margin:4px 0 0; font-size:14px; line-height:1.5; color:rgba(153,27,27,.8); }
.blocker .row{ margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
.btn-red{ border-radius:10px; background:var(--red-600); padding:8px 14px; font-size:13.5px; font-weight:500; color:#fff; }
.btn-red:hover{ background:var(--red-700); }
.btn-red-line{ border-radius:10px; border:1px solid var(--red-line); background:#fff; padding:8px 14px; font-size:13.5px; font-weight:500; color:var(--red-ink); }
.btn-red-line:hover{ background:#fee2e2; }

.tabs{ margin-bottom:28px; display:flex; gap:24px; border-bottom:1px solid var(--line); overflow-x:auto; }
.tab{ margin-bottom:-1px; border-bottom:2px solid transparent; padding:0 2px 12px; font-size:14.5px; color:var(--muted); white-space:nowrap; }
.tab:hover{ color:var(--ink); }
.tab.on{ border-color:var(--accent); color:var(--accent); font-weight:500; }
.tab.on.ink{ color:var(--ink); font-weight:400; }
.tab .n{ margin-left:4px; color:var(--faint); }

.doc-h1{ margin:0 0 28px; font-size:32px; font-weight:400; letter-spacing:-.02em; }
.sec{ margin-bottom:36px; }
.sec h2{ margin:0 0 12px; font-size:20px; font-weight:400; }
.sec h3{ margin:0 0 10px; font-size:15.5px; font-weight:400; }
.sec p{ margin:0; max-width:720px; font-size:14.5px; line-height:1.6; color:rgba(17,17,20,.8); }
.cap{ margin:-8px 0 10px; font-size:13px; color:var(--muted); }

.qc-table{ width:100%; min-width:560px; border-collapse:collapse; font-size:13.5px; }
.qc-table th{ background:var(--neutral-50); border:1px solid var(--line); padding:10px 13px; text-align:left; font-weight:400; color:rgba(17,17,20,.8); }
.qc-table td{ border:1px solid var(--line); padding:12px 13px; vertical-align:top; color:rgba(17,17,20,.85); }
.qc-table tr.clickable{ cursor:pointer; }
.qc-table tr.clickable:hover{ background:rgba(242,238,254,.35); }
.qc-table tr.open{ background:rgba(242,238,254,.55); }
.qc-table tr.em td{ font-weight:500; }
.qc-wrap{ overflow-x:auto; margin-bottom:10px; }
.source-box{ display:flex; gap:10px; border-radius:12px; border:1px solid var(--accent-line); background:rgba(242,238,254,.5); padding:12px 15px; font-size:13px; color:rgba(17,17,20,.8); }
.source-box code{ border-radius:4px; background:#fff; padding:1px 5px; font-family:var(--mono); font-size:12px; }

.step-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }
.step-list li{ display:flex; align-items:flex-start; gap:10px; font-size:14.5px; }
.stepmark{ margin-top:2px; flex:0 0 18px; }
.stepmark.num{ display:flex; height:18px; width:18px; align-items:center; justify-content:center; border-radius:999px; border:1px solid var(--accent-line); font-size:10.5px; color:var(--accent); }
.stepmark.num.blocked{ border-color:#fca5a5; color:var(--red-600); }
.currentline{ display:flex; align-items:center; gap:10px; border-radius:12px; border:1px solid var(--line); background:#fff; padding:12px 16px; font-size:14px; color:rgba(17,17,20,.8); box-shadow:var(--shadow-card); }

.dl{ display:flex; flex-direction:column; gap:12px; font-size:13px; }
.dl .row{ display:flex; gap:16px; }
.dl dt{ flex:0 0 112px; color:var(--muted); }
.dl dd{ margin:0; min-width:0; word-break:break-word; }
.provrow{ display:flex; align-items:center; gap:16px; border-top:1px solid var(--line); padding:12px 16px; }
.provrow:first-child{ border-top:0; }
.provbox{ border-radius:12px; border:1px solid var(--line); background:#fff; overflow:hidden; }
.toolrow{ border-radius:8px; }
.toolrow-btn{ display:flex; width:100%; align-items:center; gap:10px; padding:8px; text-align:left; }
.toolrow pre{ margin:0 8px 8px; overflow-x:auto; border-radius:8px; background:var(--neutral-50); padding:12px; font-family:var(--mono); font-size:11.5px; line-height:1.5; color:rgba(17,17,20,.7); }

.outputs-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.output-row{ display:flex; align-items:center; gap:14px; border-radius:12px; border:1px solid var(--line); background:#fff; padding:14px 16px; box-shadow:var(--shadow-card); }
.output-meta{ min-width:0; flex:1; }
.output-name{ display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.output-sub{ display:block; margin-top:2px; font-size:12px; color:var(--muted); }
.btn-sm{ border-radius:10px; border:1px solid var(--line); padding:6px 12px; font-size:13px; }
.btn-sm:hover{ background:var(--neutral-50); }
.iconbtn-sm{ border-radius:8px; padding:6px; color:var(--muted); }
.iconbtn-sm:hover{ background:var(--neutral-100); color:var(--ink); }

.done-card{ margin-bottom:28px; display:flex; align-items:flex-start; gap:14px; border-radius:16px; border:1px solid var(--line); background:#fff; padding:20px 24px; box-shadow:var(--shadow-card); flex-wrap:wrap; }
.done-card h1{ margin:0; font-size:20px; font-weight:400; }
.done-card p{ margin:4px 0 0; font-size:14px; line-height:1.5; color:var(--muted); }

/* ================= generic engine script (New workflow dialog) ================= */
function slugify(title) { return (title || '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 60) || 'Vert_Output'; }
function proposalFor(name, purpose) {
  const t = (name + ' ' + purpose).toLowerCase();
  let specialist = 'LedgerAgent';
  if (/tax|1065|163/.test(t)) specialist = 'TaxAgent';
  else if (/lease|842|606|memo|disclosure/.test(t)) specialist = 'TechnicalAccountingAgent';
  else if (/cash|runway|13-week/.test(t)) specialist = 'CashAgent';
  else if (/board|report/.test(t)) specialist = 'ReportingAgent';
  else if (/reconcile|match/.test(t)) specialist = 'ReconciliationAgent';
  else if (/quality|footing/.test(t)) specialist = 'QualityControlAgent';
  const steps = [
    { id: 'p1', title: 'Pull the relevant ledger data and any attached context', tools: ['fetchTrialBalance', 'fetchSubledger'] },
    { id: 'p2', title: 'Compute the analysis and draft the numbers', tools: ['parseDocument'] },
    { id: 'p3', title: 'Write the workpaper and hand it in for review', tools: ['buildWorkbook'] },
  ];
  return { specialist, steps, tools: [...new Set(steps.flatMap((s) => s.tools))], needs: ['Confirm the reporting period this covers', 'Confirm which entities or accounts are in scope', 'Confirm what you want handed back — workbook, memo, or both'] };
}
function genericScript(title, task, specialist, answers) {
  answers = answers || {};
  const name = slugify(title || task);
  const steps = [
    { title: 'Understand scope and pull source data', agent: specialist, notes: ['Pulling the trial balance and subledger detail for ' + (answers.gen_q2 || 'the requested scope') + '…'],
      calls: [{ tool: 'fetchTrialBalance', args: {}, summary: 'Trial balance pulled and tied out.' }] },
    { title: 'Compute the analysis', agent: specialist, notes: ['Working through ' + (task || title) + '…'],
      calls: [{ tool: 'fetchSubledger', args: { name: 'ap' }, summary: 'Subledger detail loaded and reconciled to the trial balance.' }] },
    { title: 'Draft the workpaper', agent: specialist, notes: ['Writing ' + name + '.xlsx…'],
      calls: [{ tool: 'buildWorkbook', args: { filename: name + '.xlsx' }, summary: 'Workbook written.',
        artifact: { id: 'art_' + name, filename: name + '.xlsx', kind: 'xlsx', sizeBytes: 15360, generatedBy: specialist, sheets: [{ name: 'Workpaper', rows: [
          ['Line', 'Detail', 'Amount'], ['Period', answers.gen_q1 || 'Current period', ''], ['Scope', answers.gen_q2 || 'All accounts', ''], ['Outputs requested', answers.gen_q3 || 'Workbook', ''],
        ] }] } }] },
  ];
  return {
    confidence: 0.82, openQuestions: [],
    clarificationIntro: 'Before I start on “' + title + '”, a few questions so the output matches what you need.',
    clarificationWhy: 'The period and scope decide which ledger data I pull; the outputs decide what I hand back for your review.',
    clarifications: [
      { id: 'gen_q1', phase: 'Understanding', question: 'Which period does this cover?', help: 'For example, April 2026 or Q1 FY26.', known: 'Period: {answer}' },
      { id: 'gen_q2', phase: 'Scope', question: 'Which entities or accounts are in scope?', help: 'Name the entity, or say “all” to include every entity in the ledger.', known: 'Scope: {answer}' },
      { id: 'gen_q3', phase: 'Outputs', question: 'What should I hand back?', help: 'A workbook, a memo, draft journal entries — or a mix.', known: 'Outputs: {answer}' },
    ],
    scope: task, reasoning: ['Routed to ' + specialist + ' based on the task description.', 'Every figure is pulled live from the connected ledger — nothing here is typed in.'],
    summary: title + ' complete. ' + steps.length + ' steps executed by ' + specialist + '.',
    findings: [specialist + ' executed ' + steps.length + ' steps against the connected ledger and produced ' + name + '.xlsx.'],
    assumptions: Object.keys(answers).map((k) => 'Taken from your answer: ' + answers[k]),
    steps,
  };
}

}

function answerClarification(runId) {
  const run = STORE.runs[runId];
  const input = document.getElementById('clarify-answer');
  const val = input ? input.value.trim() : '';
  const current = run.clarifications.find((q) => q.answer === null);
  if (!current || !val) return;
  dispatch(runId, { type: 'clarification_answered', questionId: current.id, answer: val }, Date.now());
  renderApp();
  const now = STORE.runs[runId];
  const stillOpen = now.clarifications.some((q) => q.answer === null);
  if (!stillOpen) {
    const script = scriptForRun(runId, collectAnswers(now));
    if (script) runScript(runId, script, { tickMs: 750, answers: collectAnswers(now) });
  }
}
function uploadContext(runId, files) {
  for (const f of Array.from(files || [])) { dispatch(runId, { type: 'context_uploaded', filename: f.name }); toast(f.name + ' added as context.', 'ok'); }
  renderApp();
}
function act(runId, action, payload) {
  const run = STORE.runs[runId];
  if (!run) return false;
  if (action === 'view') { if (run.status !== 'review_ready') return false; dispatch(runId, { type: 'human_viewed' }); return true; }
  if (action === 'approve') {
    if (run.status !== 'viewed') return false;
    const person = APPROVERS.find((p) => p.id === payload.approver);
    if (!person) return false;
    if (run.approvals.some((a) => a.by === person.name)) { toast(person.name + ' already approved this — a different reviewer is needed for the second sign-off.'); return false; }
    dispatch(runId, { type: 'human_approved', by: person.name, role: person.role });
    return true;
  }
  if (action === 'reject') {
    dispatch(runId, { type: 'human_rejected', reason: payload.reason, by: 'Alex Morgan' });
    setTimeout(() => {
      if (STORE.runs[runId].status !== 'rejected') return;
      const script = scriptForRun(runId, collectAnswers(STORE.runs[runId]));
      if (script) {
        runScript(runId, { steps: script.steps, summary: script.summary, findings: script.findings, assumptions: script.assumptions }, { tickMs: 650, onDone: () => toast('Vert finished the rework — ready for another look.', 'ok') });
      } else {
        dispatch(runId, { type: 'run_completed', summary: run.description, findings: run.findings, assumptions: run.assumptions });
        renderApp();
      }
    }, 1400);
    return true;
  }
  if (action === 'archive') { dispatch(runId, { type: 'human_archived' }); return true; }
  if (action === 'resolve_blocker') {
    dispatch(runId, { type: 'unblocked' });
    renderApp();
    if (runId === 'run_3way') {
      runScript(runId, threeWayScript(true), { tickMs: 700 });
    } else {
      setTimeout(() => dispatch(runId, { type: 'run_completed', summary: run.description, findings: run.findings, assumptions: run.assumptions }), 900);
    }
    return true;
  }
  return false;
}

/* ================= clarification ================= */
function renderClarification(run) {
  const firstOpen = run.clarifications.findIndex((q) => q.answer === null);
  const shown = firstOpen === -1 ? run.clarifications : run.clarifications.slice(0, firstOpen + 1);
  const current = firstOpen === -1 ? null : run.clarifications[firstOpen];
  const items = shown.map((q, i) => {
    const qHtml = '<div class="qbubble"><p class="qline">' + ic('sparkles', '', 16) + '<span class="qn tnum">' + (i + 1) + '</span><span class="qtext">' + esc(q.question) + '</span></p><p class="qhelp">' + esc(q.help) + '</p><p class="qclock">' + clock(q.askedAt) + '</p></div>';
    const aHtml = q.answer !== null ? '<div class="abubble-wrap"><p class="abubble">' + esc(q.answer) + '<span class="meta">' + (q.answeredAt ? clock(q.answeredAt) : '') + ic('check', '', 13) + '</span></p></div>' : '';
    return '<li>' + qHtml + aHtml + '</li>';
  }).join('');
  const waiting = firstOpen === -1 ? '<p class="clar-waiting">' + ic('loader', '', 15) + ' Got everything I need — building the plan.</p>' : '';
  return (
    '<div><h1 class="clar-h1">' + ic('sparkles', '', 19) + ' Clarifying your requirements</h1>' +
    '<p class="clar-intro">' + esc(run.clarificationIntro) + '</p>' +
    '<ol class="clar-list">' + items + '</ol>' + waiting +
    '<div class="clar-answerbar"><form class="answer-form" onsubmit="event.preventDefault();answerClarification(\'' + run.id + '\')">' +
      '<input id="clarify-answer" placeholder="' + (current ? 'Type your answer…' : 'All questions answered') + '" ' + (!current ? 'disabled' : '') + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();answerClarification(\'' + run.id + '\')}">' +
      '<span class="tools"><button type="button" onclick="document.getElementById(\'clarFile\').click()" aria-label="Attach context">' + ic('paperclip', '', 16) + '</button><input id="clarFile" type="file" multiple class="hidden" onchange="uploadContext(\'' + run.id + '\',this.files)">' +
      '<button type="submit" class="sendbtn" ' + (!current ? 'disabled' : '') + ' aria-label="Send answer">' + ic('arrowUp', '', 16) + '</button></span>' +

/* ================= evidence tables ================= */
function evidenceRowKey(tableId, i) { return tableId + '__' + i; }
function toggleEvidenceRow(tableId, i) {
  const key = evidenceRowKey(tableId, i);
  STATE.ui.openRow = STATE.ui.openRow === key ? null : key;
  renderApp();
}
function evidenceTableHtml(table, run, headingTag) {
  headingTag = headingTag || 'h2';
  const step = run.steps.find((s) => s.id === table.stepId);
  const rows = table.rows.map((row, i) => {
    const key = evidenceRowKey(table.id, i);
    const open = STATE.ui.openRow === key;
    const cls = cn(row.source && 'clickable', open && 'open', row.emphasis && 'em');
    const cells = row.cells.map((c) => '<td>' + esc(c) + '</td>').join('');
    const tr = '<tr class="' + cls + '"' + (row.source ? ' onclick="toggleEvidenceRow(\'' + table.id + '\',' + i + ')"' : '') + '>' + cells + '</tr>';
    let src = '';
    if (open && row.source) {
      src = '<div class="source-box">' + ic('database', '', 15) + '<p><span style="font-weight:500;color:var(--ink)">Source records:</span> ' + esc(row.source) +
        (table.tool ? ' · pulled with <code>' + esc(table.tool) + '</code>' : '') + (step ? ' in step “' + esc(step.title) + '”' : '') + '</p></div>';
    }
    return tr + (src ? '<tr class="noborder"><td colspan="' + table.columns.length + '" style="border:0;padding:6px 0">' + src + '</td></tr>' : '');
  }).join('');
  const H = headingTag;
  return (
    '<section class="sec"><' + H + ' style="' + (H === 'h3' ? 'font-size:15.5px;margin-bottom:10px' : '') + '">' + esc(table.title) + '</' + H + '>' +
    (table.caption ? '<p class="cap">' + esc(table.caption) + '</p>' : '') +
    '<div class="qc-wrap"><table class="qc-table"><thead><tr>' + table.columns.map((c) => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</section>'
  );
}
function evidenceSectionsHtml(run) {
  let out = '', lastSection;
  run.tables.forEach((t) => {
    if (t.section && t.section !== lastSection) out += '<h2 style="margin:0 0 16px;font-size:20px;font-weight:400">' + esc(t.section) + '</h2>';
    lastSection = t.section;
    out += evidenceTableHtml(t, run, t.section ? 'h3' : 'h2');
  });
  return out;
}

/* ================= plan document (non-done runs) ================= */
function stepMarkHtml(status, n) {
  if (status === 'completed') return '<span class="stepmark" style="color:#059669">' + ic('check', '', 16) + '</span>';
  if (status === 'running') return '<span class="stepmark" style="color:var(--accent)">' + ic('loader', '', 16) + '</span>';

}
function renderPlanDocument(run) {
  const tab = STATE.ui.tab || 'Plan';
  const tabs = ['Plan', 'Data', 'Outputs'].map((t) => '<button type="button" class="tab' + (tab === t ? ' on ink' : '') + '" onclick="STATE.ui.tab=\'' + t + '\';renderApp()">' + t + (t === 'Outputs' && run.artifacts.length ? '<span class="n">' + run.artifacts.length + '</span>' : '') + '</button>').join('');
  let body = '';

function renderDataTab(run) {
  const events = STORE.events[run.id] || [];

  const ctx = run.contextFiles.length ? ('<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">' + run.contextFiles.map((f) => '<li style="display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(17,17,20,.8)">' + ic('paperclip', '', 15) + esc(f) + '</li>').join('') + '</ul>') : '<p class="empty">No files attached — Vert worked from the connected ledger.</p>';
  const prov = run.provenance.length ? ('<div class="provbox">' + run.provenance.map((p) => '<div class="provrow"><span style="min-width:0;flex:1"><span style="display:block;font-size:14px;color:var(--ink)" class="truncate">' + esc(p.label) + '</span>' + (p.note ? '<span style="display:block;font-size:12.5px;color:var(--muted)" class="truncate">' + esc(p.note) + '</span>' : '') + '</span><span style="text-align:right"><span style="display:block;font-size:14px;font-weight:500;color:var(--ink)" class="tnum">' + esc(p.value) + '</span><span style="display:block;font-family:var(--mono);font-size:11px;color:var(--faint)">' + esc(p.tool) + ' · ' + esc((run.steps.find((s) => s.id === p.stepId) || {}).title || p.stepId) + '</span></span></div>').join('') + '</div>') : '<p class="empty">No figures yet.</p>';
  const toolRows = calls.map((e) => {
    const result = events.find((r) => r.seq > e.seq && r.type === 'tool_result');
    const key = 'tool_' + e.seq;

      '<span style="transition:transform .15s;flex:0 0 auto' + (open ? ';transform:rotate(90deg)' : '') + '">' + ic('chevR', '', 16) + '</span>' +
      '<code style="font-family:var(--mono);font-size:12.5px;color:var(--accent)">' + esc(e.payload.tool) + '</code>' +
      '<span class="truncate" style="flex:1;font-size:13px;color:var(--muted)">' + esc(result ? result.payload.summary : '') + '</span>' +
      '<span style="font-size:12px;color:var(--faint)">' + clock(e.at) + '</span></button>' +
      (open ? '<pre>' + esc(raw) + '</pre>' : '') + '</li>';
  }).join('');
  return (
    '<div style="display:flex;flex-direction:column;gap:40px">' +
      '<section><h2 style="margin:0 0 12px;font-size:18px;font-weight:400">Context provided</h2>' + ctx + '</section>' +
      '<section><h2 style="margin:0 0 12px;font-size:18px;font-weight:400">Figures and where they came from</h2>' + prov + '</section>' +

    '</div>'
  );

/* ================= completed page ================= */
function stamp(at) { if (!at) return ''; const d = new Date(at); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' at ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function renderCompleted(run) {
  const tab = STATE.ui.doneTab || 'Summary';

    '</section>';

    body = '<div style="display:flex;flex-direction:column">' +
      '<section class="sec" style="padding-bottom:28px;border-bottom:1px solid var(--line)"><h2>Summary of work</h2><ul style="list-style:disc;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.6;color:rgba(17,17,20,.85)">' + findings + '</ul></section>' +
      '<section class="sec" style="padding:28px 0;border-bottom:1px solid var(--line)"><h2>Assumptions Made (most important)</h2>' + assumptions + '</section>' +
      '<section class="sec" style="padding:28px 0;border-bottom:1px solid var(--line)"><h2 style="margin-bottom:16px">Outputs generated</h2>' + renderOutputsList(run) + '</section>' +
      '<section style="padding-top:28px">' + renderNextSteps(run) + '</section>' +
      '</div>';
  } else if (tab === 'Plan & Audit Trail') {
    body = '<div>' + evidenceSectionsHtml(run) + '<h2 style="margin:0 0 16px;font-size:20px;font-weight:400">Audit trail</h2>' + renderAuditTrail(run, false) + '</div>';

function renderNextSteps(run) {
  if (run.status === 'rejected') return '';
  if (run.status === 'approved') {
    return '<div class="finalbox">' + ic('shieldCheck', '', 20) + '<div><p class="t">Final. Cleared to post.</p><p class="mt6">Approved by ' + run.approvals.map((a) => a.by + ' (' + a.role + ')').join(' and ') + '.</p></div></div>';
  }
  const reviewing = run.status === 'viewed';
  const remaining = APPROVERS.filter((p) => !run.approvals.some((a) => a.by === p.name));
  if (!STATE.ui.approver || !remaining.find((p) => p.id === STATE.ui.approver)) STATE.ui.approver = remaining[0] ? remaining[0].id : '';
  const current = remaining.find((p) => p.id === STATE.ui.approver) || remaining[0];
  let approvalsList = '';
  if (reviewing) {
    approvalsList = '<ol class="approvals-list">' + Array.from({ length: APPROVALS_REQUIRED }).map((_, i) => {
      const a = run.approvals[i];
      return '<li><span class="appr-mark' + (a ? ' done' : '') + '">' + (a ? '✓' : i + 1) + '</span>' + (a ? ('<span style="color:rgba(17,17,20,.85)">' + esc(a.by) + ' <span style="color:var(--muted)">· ' + esc(a.role) + '</span></span>') : ('<span style="color:var(--muted)">Waiting for ' + (i === 0 ? 'first' : 'second') + ' approval</span>')) + '</li>';
    }).join('') + '</ol>';
  }
  let controls;
  if (STATE.ui.requestingChanges) {
    controls = '<div class="reworkbox"><textarea id="request-changes" rows="3" placeholder="What should Vert change? This becomes its next instruction." oninput="STATE.ui.changeReason=this.value">' + esc(STATE.ui.changeReason || '') + '</textarea>' +
      '<div style="display:flex;gap:8px"><button type="button" class="btn-accent" ' + (!(STATE.ui.changeReason || '').trim() ? 'disabled' : '') + ' onclick="submitChanges(\'' + run.id + '\')">Send to Vert</button>' +
      '<button type="button" class="btn-ghost" onclick="STATE.ui.requestingChanges=false;renderApp()">Cancel</button></div></div>';
  } else {
    controls = '<div class="next-actions">' + (reviewing ?
      ('<label class="approver-select">Approve as<select onchange="STATE.ui.approver=this.value;renderApp()">' + remaining.map((p) => '<option value="' + p.id + '"' + (current && p.id === current.id ? ' selected' : '') + '>' + p.name + ' — ' + p.role + '</option>').join('') + '</select></label>' +
        '<button type="button" class="btn-accent" onclick="approveRun(\'' + run.id + '\')">Approve</button>') :
      ('<button type="button" class="btn-accent" onclick="markForReview(\'' + run.id + '\')">Mark for Review</button>')) +
      '<button type="button" class="btn-ghost" onclick="STATE.ui.requestingChanges=true;STATE.ui.changeReason=\'\';renderApp()">' + (reviewing ? 'Request changes' : 'Re-run Task') + '</button></div>';
  }

    '<p style="margin:0;font-size:14px;color:var(--muted)">' + (reviewing ? ('Nothing finalizes until two different reviewers approve. ' + run.approvals.length + ' of ' + APPROVALS_REQUIRED + ' so far.') : 'Review outputs and complete any remaining items before moving to review.') + '</p>' +
    approvalsList + controls + '</div>';
}
function markForReview(id) { if (act(id, 'view')) toast('Marked for review. Two approvals will finalize it.', 'ok'); renderApp(); }
function approveRun(id) {
  const approverId = STATE.ui.approver;
  const person = APPROVERS.find((p) => p.id === approverId);
  if (act(id, 'approve', { approver: approverId })) toast('Approved by ' + (person ? person.name : '') + '.', 'ok');

function submitChanges(id) {
  const reason = (STATE.ui.changeReason || '').trim();
  if (!reason) return;
  if (act(id, 'reject', { reason })) { STATE.ui.requestingChanges = false; STATE.ui.changeReason = ''; toast('Sent back to Vert with your note.', 'ok'); }
  renderApp();
}

/* ================= audit trail ================= */
function describeEvent(e, run) {
  const p = e.payload;
  const stepTitle = (id) => { const s = run.steps.find((s) => s.id === id); return s ? s.title : String(id); };
  switch (e.type) {
    case 'clarification_requested': return { actor: run.agent, kind: 'ai', text: 'Asked ' + (p.questions || []).length + ' clarifying questions' };
    case 'clarification_answered': { const q = run.clarifications.find((c) => c.id === p.questionId); return { actor: 'Alex Morgan', kind: 'human', text: '“' + (q ? q.question : p.questionId) + '” — ' + p.answer }; }
    case 'context_uploaded': return { actor: 'Alex Morgan', kind: 'human', text: 'Uploaded ' + p.filename };
    case 'plan_created': return { actor: run.agent, kind: 'ai', text: 'Planned ' + (p.steps || []).length + ' steps' };
    case 'step_started': return { actor: p.agent, kind: 'ai', text: 'Started “' + stepTitle(p.stepId) + '”' };
    case 'tool_result': return { actor: run.agent, kind: 'ai', text: p.summary };
    case 'artifact_created': return { actor: run.agent, kind: 'ai', text: 'Wrote ' + p.artifact.filename };
    case 'blocked': return { actor: run.agent, kind: 'ai', text: 'Stopped: ' + p.blocker.title };
    case 'unblocked': return { actor: 'Alex Morgan', kind: 'human', text: 'Resolved the blocker' };
    case 'run_completed': return { actor: run.agent, kind: 'ai', text: 'Handed in the workpapers for review' };
    case 'run_failed': return { actor: 'System', kind: 'system', text: 'Run failed: ' + p.error };
    case 'human_viewed': return { actor: 'Alex Morgan', kind: 'human', text: 'Marked for review' };
    case 'human_approved': return { actor: p.by, kind: 'human', text: 'Approved as ' + p.role };
    case 'human_rejected': return { actor: p.by || 'Alex Morgan', kind: 'human', text: 'Requested changes: ' + p.reason };
    case 'human_archived': return { actor: 'Alex Morgan', kind: 'human', text: 'Archived the workflow' };
    default: return null;
  }
}
function renderAuditTrail(run, compact) {
  const events = STORE.events[run.id] || [];
  const lines = events.map((e) => ({ e, line: describeEvent(e, run) })).filter((x) => x.line).reverse();
  if (!lines.length) return '<p class="empty">No activity yet.</p>';
  const iconFor = (k) => k === 'ai' ? ic('sparkles', '', 16) : k === 'human' ? ic('user', '', 16) : ic('circleDot', '', 16);
  return '<ol class="audit-list' + (compact ? ' compact' : '') + '">' + lines.map(({ e, line }) =>
    '<li><span class="audit-icon" style="color:' + (line.kind === 'ai' ? 'var(--accent)' : line.kind === 'human' ? 'rgba(17,17,20,.6)' : 'var(--faint)') + '">' + iconFor(line.kind) + '</span>' +
    '<span class="audit-line"><span class="audit-top"><span class="audit-actor">' + esc(line.actor) + '</span><span class="audit-kind ' + line.kind + '">' + (line.kind === 'ai' ? 'AI agent' : line.kind === 'human' ? 'Human' : 'System') + '</span><span class="audit-clock">' + clock(e.at) + '</span></span>' +
    '<span class="audit-text">' + esc(line.text) + '</span></span></li>'
  ).join('') + '</ol>';
}

/* ================= vert panel ================= */
const PHASES = ['Understanding', 'Scope', 'Data', 'Outputs', 'Review'];
function foldHtml(id, title, bodyHtml, openDefault) {
  const open = STATE.ui.folds && STATE.ui.folds[id] !== undefined ? STATE.ui.folds[id] : !!openDefault;
  return '<section class="fold"><button type="button" class="fold-btn" onclick="toggleFold(\'' + id + '\')">' + title + '<span class="chev' + (open ? ' open' : '') + '">' + ic('chevD', '', 16) + '</span></button>' + (open ? ('<div class="fold-body">' + bodyHtml + '</div>') : '') + '</section>';
}
function toggleFold(id) { STATE.ui.folds = STATE.ui.folds || {}; STATE.ui.folds[id] = !(STATE.ui.folds[id] !== undefined ? STATE.ui.folds[id] : false); renderApp(); }

function renderPanel(run) {
  const done = ['review_ready', 'viewed', 'approved'].includes(run.status);
  const previewId = STATE.ui.previewArtifact !== undefined && STATE.ui.previewArtifact !== null ? STATE.ui.previewArtifact : (done ? (run.artifacts[0] && run.artifacts[0].id) : null);
  const artifact = run.artifacts.find((a) => a.id === previewId);
  const closeBtn = '<button type="button" class="iconbtn" style="border:0;padding:6px" onclick="STATE.ui.panelOpen=false;renderApp()" aria-label="Close panel">' + ic('x', '', 16) + '</button>';
  const backBtn = artifact ? '<button type="button" class="iconbtn" style="border:0;padding:6px" onclick="STATE.ui.previewArtifact=null;renderApp()" aria-label="Back to activity">' + ic('max2', '', 15) + '</button>' : '';
  const head = '<header class="panel-head">' + ic('shieldCheck', '', 19) + '<h2>Vert AI</h2>' + backBtn + closeBtn + '</header>';

  let content;
  if (done && artifact) {
    content = '<div class="panel-body" style="padding-bottom:0"><div class="sheetprev">' + renderSheetPreview(artifact) + '</div></div>';
  } else if (run.status === 'clarifying') {
    const currentPhase = (run.clarifications.find((q) => q.answer === null) || {}).phase || 'Review';
    const phaseIdx = PHASES.indexOf(currentPhase);
    const stepper = '<ol class="stepper">' + PHASES.map((p, i) => '<li><span class="dot ' + (i < phaseIdx ? 'past' : i === phaseIdx ? 'cur' : '') + '">' + (i === phaseIdx ? '<i></i>' : '') + '</span><span class="lbl' + (i === phaseIdx ? ' cur' : '') + '">' + p + '</span></li>').join('') + '</ol>';
    const ctxFiles = run.contextFiles.length ? ('<ul style="list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;color:rgba(17,17,20,.8)">' + run.contextFiles.map((f) => '<li>· ' + esc(f) + '</li>').join('') + '</ul>') : '';
    const known = run.clarifications.filter((q) => q.answer !== null);
    const knowHtml = known.length ? ('<ul class="knowlist">' + known.map((q) => '<li><span class="ck">✓</span>' + esc(q.known.replace('{answer}', (q.answer || '').replace(/\.$/, ''))) + '</li>').join('') + '</ul>') : '<p class="empty">Nothing yet — answer the first question to get started.</p>';
    content = '<div class="panel-body">' +
      '<section class="pcard"><h3>Clarification progress</h3>' + stepper + '</section>' +
      '<section class="pcard"><h3>Context provided</h3><label class="pdrop" onclick="document.getElementById(\'panelFile\').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();uploadContext(\'' + run.id + '\',event.dataTransfer.files)">' + ic('arrowUp', '', 18) + '<span class="t1">Upload context or data</span><span class="t2">Drag and drop files here, or click to browse</span><span class="t2">Supports PDF, Excel, CSV, and more</span></label><input id="panelFile" type="file" multiple class="hidden" onchange="uploadContext(\'' + run.id + '\',this.files)">' + ctxFiles + '</section>' +
      '<section class="pcard"><h3>What I know so far</h3>' + knowHtml + '</section>' +
      (run.clarificationWhy ? ('<section class="pcard"><h3>Why this matters</h3><p style="margin:0;font-size:13px;line-height:1.6;color:rgba(17,17,20,.75)">' + esc(run.clarificationWhy) + '</p></section>') : '') +
      '<p class="lockline">🔒 Your data is secure and never used to train models.</p>' +
    '</div>';
  } else {
    const canFollowUp = run.status === 'review_ready' || run.status === 'viewed';
    const reasoningBody = run.reasoning.length ? ('<ul>' + run.reasoning.map((r) => '<li>' + esc(r) + '</li>').join('') + '</ul>') : '<p class="empty">No reasoning notes recorded for this run.</p>';
    const planSteps = '<ol class="plansteps">' + run.steps.map((s, i) => '<li>' + stepMarkHtml(s.status, i + 1).replace('stepmark','stepmark').replace('16px','14px') + esc(s.title) + '</li>').join('') + '</ol>';
    content = '<div class="panel-body">' +
      '<div class="chat-task"><p class="b">' + esc(run.task) + '<span class="chat-clock">' + clock(run.createdAt) + '</span></p></div>' +
      '<section class="pcard"><p class="status"><span class="status-dot' + (done ? '' : ' pulse') + '"></span>' + (done ? 'Workflow complete' : run.status === 'blocked' ? 'Waiting on you' : 'Planning workflow…') + '</p><p style="margin:0 0 12px;font-size:13px;color:var(--muted)">I’ll break this down into clear steps and checks.</p>' +
        '<ol class="plansteps">' + run.steps.map((s, i) => '<li>' + stepMarkHtml(s.status, i + 1) + '<span>' + esc(s.title) + '</span></li>').join('') + (!run.steps.length ? '<li class="empty">Building the plan…</li>' : '') + '</ol></section>' +
      foldHtml('reasoning', 'Reasoning', reasoningBody, false) +
      foldHtml('audit', 'Audit Trail', renderAuditTrail(run, true), false) +
      foldHtml('plan', 'Workflow Plan', planSteps, true) +
    '</div>' +
    '<form class="followup" onsubmit="event.preventDefault();sendFollowUp(\'' + run.id + '\')"><textarea rows="2" ' + (!canFollowUp ? 'disabled' : '') + ' placeholder="' + (canFollowUp ? 'Ask a follow-up — Vert reworks the task with it' : 'Follow-ups open once Vert hands the work in') + '" oninput="STATE.ui.followUp=this.value">' + esc(STATE.ui.followUp || '') + '</textarea>' +
      '<div class="row"><label style="cursor:pointer;border-radius:8px;padding:4px" for="panelFile2">' + ic('plus', '', 16) + '</label><input id="panelFile2" type="file" multiple class="hidden" onchange="uploadContext(\'' + run.id + '\',this.files)"><span class="mic" style="opacity:.4">' + ic('mic', '', 16) + '</span>' +
      '<button type="submit" class="send" ' + (!canFollowUp || !(STATE.ui.followUp || '').trim() ? 'disabled' : '') + ' aria-label="Send follow-up">' + ic('arrowUp', '', 16) + '</button></div></form>';
  }
  return '<aside class="panel' + (STATE.ui.panelOpen ? ' open' : '') + '">' + head + content + '</aside>';
}
function sendFollowUp(id) {
  const val = (STATE.ui.followUp || '').trim();
  if (!val) return;
  if (act(id, 'reject', { reason: val })) { toast('Vert is reworking the task with your instruction.', 'ok'); STATE.ui.followUp = ''; }
  renderApp();
}

/* ================= sheet preview ================= */
const COLS_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function cellFmt(v) { return typeof v === 'number' ? v.toLocaleString('en-US', { maximumFractionDigits: 2 }) : v; }
function renderSheetPreview(artifact) {
  const tab = STATE.ui.previewTab || 'Preview';
  const sheetIdx = STATE.ui.sheetIdx || 0;
  const head = '<div class="sheetprev-head">' + fileChip(artifact.kind, 'md') + '<span class="sheetprev-name" title="' + esc(artifact.filename) + '">' + esc(artifact.filename) + '</span>' +
    '<button type="button" class="iconbtn-sm" onclick="blockedDownload()" aria-label="Download">' + ic('file', '', 16) + '</button></div>';
  const tabs = '<nav class="sheetprev-tabs">' + ['Preview', 'Details'].map((t) => '<button type="button" class="' + (tab === t ? 'on' : '') + '" onclick="STATE.ui.previewTab=\'' + t + '\';renderApp()">' + t + '</button>').join('') + '</nav>';
  let body;
  if (tab === 'Details') {
    body = '<dl class="details-dl">' + [['File', artifact.filename], ['Type', artifact.kind.toUpperCase()], ['Size', fmtBytes(artifact.sizeBytes)], ['Generated by', artifact.generatedBy], ['Sheets', artifact.sheets ? artifact.sheets.map((s) => s.name).join(', ') : '—']]
      .map(([k, v]) => '<div class="row"><dt>' + k + '</dt><dd>' + esc(v) + '</dd></div>').join('') + '</dl>';
  } else if (artifact.sheets && artifact.sheets[sheetIdx]) {
    const sheet = artifact.sheets[sheetIdx];
    const width = Math.max.apply(null, sheet.rows.map((r) => r.length).concat([1]));
    const filler = Math.max(0, 24 - sheet.rows.length);
    const sheetSelect = artifact.sheets.length > 1 ? ('<label class="sheet-select">Sheet:<select onchange="STATE.ui.sheetIdx=Number(this.value);renderApp()">' + artifact.sheets.map((s, i) => '<option value="' + i + '"' + (i === sheetIdx ? ' selected' : '') + '>' + s.name + '</option>').join('') + '</select></label>') : '';
    const thead = '<tr><th class="rownum"></th>' + Array.from({ length: width }).map((_, i) => '<th>' + (COLS_LETTERS[i] || (i + 1)) + '</th>').join('') + '</tr>';
    const rows = sheet.rows.map((row, r) => '<tr' + (r === 0 ? ' class="r0"' : '') + '><td class="rn">' + (r + 1) + '</td>' + Array.from({ length: width }).map((_, c) => '<td class="' + (typeof row[c] === 'number' ? 'num' : '') + '" title="' + esc(row[c] === undefined ? '' : row[c]) + '">' + (row[c] === undefined ? '' : esc(cellFmt(row[c]))) + '</td>').join('') + '</tr>').join('');
    const fillerRows = Array.from({ length: filler }).map((_, i) => '<tr><td class="rn">' + (sheet.rows.length + i + 1) + '</td>' + Array.from({ length: width }).map(() => '<td style="height:22px"></td>').join('') + '</tr>').join('');
    const tabbar = artifact.sheets.length > 1 ? ('<nav class="sheet-tabbar">' + artifact.sheets.map((s, i) => '<button type="button" class="' + (i === sheetIdx ? 'on' : '') + '" onclick="STATE.ui.sheetIdx=' + i + ';renderApp()">' + s.name + '</button>').join('') + '</nav>') : '';
    body = sheetSelect + '<div class="gridwrap"><table class="grid"><thead>' + thead + '</thead><tbody>' + rows + fillerRows + '</tbody></table></div>' + tabbar;
  } else if (artifact.paragraphs) {
    body = '<div class="memowrap">' + artifact.paragraphs.map((p) => p.indexOf('§ ') === 0 ? ('<h3>' + esc(p.slice(2)) + '</h3>') : ('<p>' + esc(p) + '</p>')).join('') + '</div>';
  } else {
    body = '<p class="empty">No preview for this file.</p>';
  }
  return head + tabs + body;
}

/* ================= master render ================= */
function renderApp() {
  const root = document.getElementById('app');
  if (STATE.screen === 'workflow' && STATE.runId && STORE.runs[STATE.runId]) {
    const run = STORE.runs[STATE.runId];
    const done = ['review_ready', 'viewed', 'approved', 'rejected', 'archived'].includes(run.status);
    let center;
    if (run.status === 'clarifying') center = renderClarification(run);
    else if (done) center = renderCompleted(run);
    else center = renderPlanDocument(run);
    root.innerHTML =
      renderSidebar() +
      '<div class="main"><div class="wf-shell">' +
        '<div class="wf-main">' + renderWfHeader(run) + '<div class="wf-body">' + (run.blocker && run.status === 'blocked' ? renderBlocker(run) : '') + center + '</div></div>' +
        renderPanel(run) +
      '</div></div>' + renderPalette();
  } else {
    root.innerHTML = renderSidebar() + '<div class="main"><div class="command">' + renderHeader() + renderBoard() + '</div></div>' + renderPalette();
  }
  renderToasts();
}

/* ================= global keys + boot ================= */
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') { if (STATE.palette.open) closePalette(); else if (STATE.ui.menu) { STATE.ui.menu = false; renderApp(); } }
});
window.addEventListener('resize', () => { if (window.innerWidth > 900) STATE.sidebarOpen = false; });

startAmbientTickers();
renderApp();
</script>
