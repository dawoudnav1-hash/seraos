#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;background:var(--paper);overflow:hidden}
.layer{position:absolute;inset:0;will-change:opacity,transform}
.center{display:flex;align-items:center;justify-content:center}

/* ============================ SHELL ========================== */
#shell{position:absolute;inset:0;transform-origin:center center;will-change:transform}
.sidebar{position:absolute;top:0;left:0;width:290px;height:1080px;background:var(--ink);
  border-right:1px solid #1e1e1e;padding:34px 20px 26px;display:flex;flex-direction:column;z-index:5}
.workspace{position:absolute;top:0;left:290px;width:1630px;height:1080px;background:var(--paper);overflow:hidden}

/* sidebar brand */
.sb-brand{display:flex;align-items:center;gap:13px;padding:0 8px 2px}
.sb-brand .wm{color:#F4F4F2;font-size:30px;font-weight:600;letter-spacing:-.02em}
.sb-sec{color:#5f5f5c;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:0 14px;margin:26px 0 9px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:26px}
.nav-item{display:flex;align-items:center;gap:13px;height:42px;padding:0 14px;border-radius:11px;
  color:#9d9d9a;font-size:16px;font-weight:500;letter-spacing:-.01em;position:relative}
.nav-item svg{width:19px;height:19px;flex:none;stroke:#8a8a87;stroke-width:1.7;fill:none}
.nav-item.sub{height:37px;font-size:15px;color:#8f8f8c;padding-left:44px}
.nav-item.active{background:#ffffff12;color:#f3f3f1}
.nav-item.active svg{stroke:#f3f3f1}
.nav-item.hot{background:#ffffff10;color:#eaeae8}
.nav-caret{margin-left:auto;width:15px;height:15px;stroke:#6c6c69;stroke-width:1.8;fill:none}
.nav-spacer{flex:1}
.sb-new{display:flex;align-items:center;justify-content:center;gap:9px;height:50px;background:#fff;color:#111;
  border-radius:13px;font-size:15.5px;font-weight:600;margin:0 6px 16px;box-shadow:0 1px 0 #ffffff10;white-space:nowrap}
.sb-new svg{width:18px;height:18px;stroke:#111;stroke-width:2;fill:none;flex:none}
.sb-user{display:flex;align-items:center;gap:12px;padding:8px 8px 0;border-top:1px solid #ffffff10;margin:0 4px;padding-top:14px}
.sb-ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,#3a3a3a,#171717);
  display:flex;align-items:center;justify-content:center;color:#e9e9e7;font-size:14px;font-weight:600;flex:none;
  background-size:cover;background-position:center}
.sb-user .nm{font-size:14.5px;font-weight:600;color:#eaeae8;line-height:1.25}
.sb-user .rl{font-size:12.5px;color:#7d7d7a}
.sb-gear{margin-left:auto;width:18px;height:18px;stroke:#6c6c69;stroke-width:1.7;fill:none}

/* topbar */
.topbar{position:absolute;top:0;left:0;right:0;height:96px;display:flex;align-items:center;
  padding:0 56px;z-index:4}
.greet{font-size:34px;font-weight:600;letter-spacing:-.025em;color:#1a1a1d}
.top-actions{margin-left:auto;display:flex;gap:12px}
.pill{display:flex;align-items:center;gap:9px;height:46px;padding:0 20px;border:1px solid var(--line);
  background:#fff;border-radius:12px;font-size:15px;font-weight:600;color:#2a2a2d;box-shadow:var(--sh1)}
.pill svg{width:17px;height:17px;stroke:#4a4a4d;stroke-width:1.8;fill:none}
.pill .badge{background:var(--ink);color:#fff;font-size:12px;border-radius:6px;padding:1px 7px}

/* ---- command view (S2) ---- */
#ws-command{position:absolute;inset:0;padding:118px 56px 0}
.cmd-search{position:relative;height:76px;background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--sh2);display:flex;align-items:center;padding:0 24px;max-width:1360px}
.cmd-search .mag{width:23px;height:23px;stroke:#9a9a95;stroke-width:1.9;fill:none;flex:none;margin-right:16px}
.cmd-text{font-size:21px;color:#26262a;letter-spacing:-.01em;font-weight:450;white-space:nowrap;overflow:hidden}
.cmd-text .ph{color:#a4a49e}
.cmd-caret{display:inline-block;width:2px;height:26px;background:#26262a;margin-left:1px;vertical-align:-5px;border-radius:2px}
.cmd-send{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:12px;
  background:var(--ink);display:flex;align-items:center;justify-content:center}
.cmd-send svg{width:21px;height:21px;stroke:#fff;stroke-width:1.9;fill:none}
.cmd-tabs{display:flex;gap:8px;margin-top:26px}
.tab{display:flex;align-items:center;gap:9px;height:44px;padding:0 18px;border:1px solid var(--line);background:#fff;
  border-radius:11px;font-size:15px;font-weight:600;color:#54544f}
.tab svg{width:16px;height:16px;stroke:#6a6a65;stroke-width:1.8;fill:none}
.tab.on{background:#101012;color:#fff;border-color:#101012}
.tab.on svg{stroke:#fff}

/* intelligence status */
#think{position:absolute;left:56px;top:336px;width:700px}
.think-row{display:flex;align-items:center;gap:18px;height:64px}
.think-orb{position:relative;width:44px;height:44px;flex:none}
.think-orb canvas{position:absolute;inset:0}
.think-line{font-size:23px;font-weight:500;letter-spacing:-.015em;color:#26262a}
.think-sub{font-size:16px;color:var(--text3);margin-top:2px}
.think-steps{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.tstep{display:flex;align-items:center;gap:14px;font-size:17px;color:#8a8a85;font-weight:500}
.tstep .dot{width:20px;height:20px;border-radius:50%;border:2px solid #d9d9d3;flex:none;position:relative}
.tstep.done .dot{background:var(--green);border-color:var(--green)}
.tstep.done{color:#3a3a37}
.tstep .dot .ck{position:absolute;inset:0;stroke:#fff;stroke-width:2.6;fill:none}

/* ---- generic modal (clarify/plan) ---- */
.ws-scrim{position:absolute;inset:0;background:rgba(18,18,20,.34);backdrop-filter:blur(3px)}
.modal{position:absolute;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh3);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:22px 30px;border-bottom:1px solid var(--line2);
  position:relative;z-index:3;background:#fff}
.modal-vp{position:absolute;left:0;right:0;top:70px;bottom:0;overflow:hidden}
.modal-head .mk{width:26px;height:26px;flex:none}
.modal-head .ttl{font-size:16px;font-weight:600;color:#3a3a37;letter-spacing:-.01em}
.modal-head .cls{margin-left:auto;width:26px;height:26px;stroke:#a0a09a;stroke-width:1.8;fill:none}

/* clarify (S3) */
#ws-clarify .modal{left:355px;top:96px;width:920px;height:888px;padding:0}
.clar-scroll{padding:30px 40px 40px}
.clar-kicker{display:flex;align-items:center;gap:12px;color:#5a5a56;font-size:15px;font-weight:600;margin-bottom:6px}
.clar-kicker .ci{width:22px;height:22px;flex:none}
.clar-intro{font-size:18px;color:#4c4c48;margin:2px 0 26px;letter-spacing:-.01em}
.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-bottom:20px;box-shadow:var(--sh1)}
.qq{font-size:19px;font-weight:600;color:#1e1e21;letter-spacing:-.015em;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:14px;height:56px;padding:0 18px;border:1px solid var(--line);border-radius:13px;
  margin-bottom:10px;font-size:16.5px;color:#5c5c57;font-weight:500;position:relative;background:#fff}
.opt .idx{width:26px;height:26px;border-radius:8px;background:#f3f3ef;color:#9a9a93;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none}
.opt .lbl{display:flex;align-items:center;gap:11px}
.opt .fx{width:19px;height:19px;stroke:#8a8a85;stroke-width:1.7;fill:none;flex:none}
.opt.sel{border-color:#141414;background:#fafafa;color:#141414;box-shadow:0 0 0 1px #141414}
.opt.sel .idx{background:#141414;color:#fff}
.opt .ok{margin-left:auto;width:22px;height:22px;stroke:var(--green);stroke-width:2.4;fill:none;opacity:0}
.opt.sel .ok{opacity:1}

/* plan (S4) */
#ws-plan .modal{left:300px;top:70px;width:1030px;height:940px;padding:0}
.plan-vp{position:absolute;left:0;right:0;top:70px;bottom:82px;overflow:hidden}
.plan-inner{padding:34px 46px 40px;will-change:transform}
.plan-h1{font-size:34px;font-weight:700;letter-spacing:-.03em;color:#131316}
.plan-meta{font-size:15px;color:var(--text3);margin-top:7px}
.plan-sec{margin-top:30px}
.plan-lab{font-size:19px;font-weight:700;letter-spacing:-.02em;color:#1c1c1f;margin-bottom:12px}
.plan-obj{font-size:17px;line-height:1.6;color:#4a4a46;max-width:820px}
.plan-obj b{color:#20201f;font-weight:600}
.src-grid{display:flex;flex-wrap:wrap;gap:12px}
.src{display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;border:1px solid var(--line);border-radius:12px;
  background:#fcfcfb;font-size:16px;font-weight:600;color:#33332f;box-shadow:var(--sh1)}
.src .fi{width:22px;height:24px;flex:none;stroke:#33332f;stroke-width:1.7;fill:none}
.src .cn{margin-left:6px;display:flex;align-items:center;gap:6px;color:var(--green);font-size:13px;font-weight:600}
.src .cn .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
.steps{display:flex;flex-direction:column;gap:0}
.pstep{display:flex;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line2)}
.pstep .num{width:30px;height:30px;border-radius:9px;background:#f2f2ee;color:#7a7a74;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none}
.pstep .st{font-size:17px;font-weight:500;color:#33332f;letter-spacing:-.01em}
.pstep .pk{margin-left:auto;width:24px;height:24px;stroke:var(--green);stroke-width:2.4;fill:none;opacity:0}
.pstep.done .num{background:var(--green);color:#fff}
.pstep.done .pk{opacity:1}
.conf{margin-top:26px;display:flex;align-items:center;gap:16px;background:var(--greenbg);border:1px solid var(--greenln);
  border-radius:14px;padding:16px 22px}
.conf .ic{width:30px;height:30px;stroke:var(--green);stroke-width:2;fill:none;flex:none}
.conf .t1{font-size:16.5px;font-weight:600;color:#136b39}
.conf .t2{font-size:14.5px;color:#2f7b52}
.conf .pct{margin-left:auto;font-size:30px;font-weight:800;letter-spacing:-.03em;color:#12904a}
.plan-foot{position:absolute;left:0;right:0;bottom:0;height:82px;border-top:1px solid var(--line2);
  display:flex;align-items:center;padding:0 46px;background:#fff}
.plan-foot .draft{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--text3);font-weight:600}
.plan-foot .draft .d{width:9px;height:9px;border-radius:50%;background:#cfcfc8}
.btn-dark{margin-left:auto;height:50px;padding:0 30px;background:var(--ink);color:#fff;border-radius:12px;
  font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--sh2)}
.btn-dark svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}
.btn-ghost{height:50px;padding:0 26px;border:1px solid var(--line);color:#4a4a46;border-radius:12px;
  font-size:16px;font-weight:600;display:flex;align-items:center;background:#fff;margin-right:12px}

/* ---- reconciliation (S5) ---- */
#ws-recon{position:absolute;inset:0;padding:118px 56px 0}
.rc-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.rc-title{font-size:30px;font-weight:700;letter-spacing:-.03em;color:#141417}
.rc-chip{display:flex;align-items:center;gap:9px;height:36px;padding:0 15px;border-radius:9px;font-size:14.5px;font-weight:600}
.rc-chip.run{background:#141414;color:#fff}
.rc-chip .spin{width:15px;height:15px}
.rc-sub{font-size:16.5px;color:var(--text2);margin-bottom:26px}
.rc-cols{display:flex;gap:26px}
.rc-left{width:830px}
.rc-right{flex:1}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh1);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line2);
  font-size:16px;font-weight:700;color:#2a2a27;letter-spacing:-.01em}
.panel-h .cnt{margin-left:auto;font-size:14.5px;font-weight:600;color:var(--text2)}
.match-row{display:flex;align-items:center;gap:0;padding:15px 24px;border-bottom:1px solid var(--line2);position:relative}
.mr-inv{width:230px}
.mr-k{font-size:13px;color:var(--text3);font-weight:600;letter-spacing:.02em}
.mr-v{font-size:16.5px;color:#26262a;font-weight:600;margin-top:2px}
.mr-arrow{width:64px;display:flex;align-items:center;justify-content:center}
.mr-arrow svg{width:26px;height:22px;stroke:var(--green);stroke-width:2;fill:none}
.mr-pay{flex:1}
.mr-badge{margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;
  background:var(--greenbg);border:1px solid var(--greenln);color:#137a41;font-size:14px;font-weight:600}
.mr-badge svg{width:16px;height:16px;stroke:var(--green);stroke-width:2.6;fill:none}
.hero-match{margin:20px 24px 4px;background:#fbfbfa;border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--sh1)}
.hm-top{display:flex;align-items:center;gap:20px}
.hm-card{flex:1}
.hm-k{font-size:13.5px;color:var(--text3);font-weight:600}
.hm-inv{font-size:22px;font-weight:700;color:#18181b;letter-spacing:-.02em;margin-top:3px}
.hm-amt{font-size:22px;font-weight:700;color:#18181b;letter-spacing:-.02em;margin-top:3px}
.hm-co{font-size:15px;color:var(--text2);margin-top:3px}
.hm-link{width:130px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--green)}
.hm-link .ln{height:2px;background:var(--greenln);width:100%;position:relative;border-radius:2px}
.hm-link .ln .fill{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:2px}
.hm-link .tg{font-size:13px;font-weight:700;letter-spacing:.02em}
.hm-conf{margin-top:16px;display:flex;align-items:center;gap:10px;color:#137a41;font-size:15px;font-weight:600}
.hm-conf svg{width:18px;height:18px;stroke:var(--green);stroke-width:2.4;fill:none}

/* exception detection */
.exc-big{padding:26px 26px 8px}
.exc-num{font-size:66px;font-weight:800;letter-spacing:-.04em;color:#141417;line-height:1}
.exc-lab{font-size:16.5px;color:var(--text2);font-weight:500;margin-top:8px}
.exc-list{padding:8px 26px 26px}
.exc-item{padding:16px 0;border-bottom:1px solid var(--line2)}
.exc-top{display:flex;align-items:center;justify-content:space-between}
.exc-name{font-size:16.5px;font-weight:600;color:#2c2c29}
.exc-cnt{font-size:16.5px;font-weight:700;color:#18181b}
.exc-bar{height:8px;border-radius:5px;background:#efefe9;margin-top:11px;overflow:hidden}
.exc-fill{height:100%;border-radius:5px}

/* ---- audit output (S6) ---- */
#ws-audit{position:absolute;inset:0;padding:104px 56px 0}
.au-title{font-size:32px;font-weight:700;letter-spacing:-.03em;color:#141417}
.au-sub{font-size:16.5px;color:var(--text2);margin-top:5px;margin-bottom:24px}
.au-stats{display:flex;gap:20px;margin-bottom:24px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:var(--sh1)}
.stat .k{font-size:15.5px;color:var(--text2);font-weight:600}
.stat .v{font-size:42px;font-weight:800;letter-spacing:-.035em;margin-top:10px;color:#141417}
.stat.g .v{color:var(--green)} .stat.r .v{color:var(--red)}
.stat .bar{height:7px;border-radius:5px;background:#efefe9;margin-top:16px;overflow:hidden}
.stat .bar .f{height:100%;border-radius:5px}
.au-cols{display:flex;gap:20px}
.au-ev{width:640px}
.ev-item{display:flex;align-items:center;gap:15px;height:60px;border-bottom:1px solid var(--line2);padding:0 4px}
.ev-item .ck{width:28px;height:28px;border-radius:8px;background:var(--greenbg);border:1px solid var(--greenln);
  display:flex;align-items:center;justify-content:center;flex:none}
.ev-item .ck svg{width:16px;height:16px;stroke:var(--green);stroke-width:2.6;fill:none}
.ev-item .t{font-size:17px;font-weight:500;color:#33332f}
.ev-item .badge{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--green);background:var(--greenbg);
  border:1px solid var(--greenln);border-radius:7px;padding:4px 11px}
.au-exc{flex:1}
.exr{padding:22px 26px}
.exr-tag{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;
  background:var(--amberbg);color:var(--amber);font-size:13.5px;font-weight:700}
.exr-tag svg{width:16px;height:16px;stroke:var(--amber);stroke-width:2;fill:none;flex:none}
.rc-chip .spin svg{width:15px;height:15px}
.exr-q{font-size:20px;font-weight:700;color:#1a1a1d;letter-spacing:-.02em;margin:14px 0 4px}
.exr-row{display:flex;gap:12px;margin-top:16px}
.exr-box{flex:1;background:#fbfbfa;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.exr-box .k{font-size:13px;color:var(--text3);font-weight:600}
.exr-box .v{font-size:16px;font-weight:600;color:#26262a;margin-top:4px}
.exr-rec{margin-top:16px;background:var(--greenbg);border:1px solid var(--greenln);border-radius:12px;padding:16px 18px}
.exr-rec .k{font-size:13.5px;color:#2f7b52;font-weight:700;letter-spacing:.02em}
.exr-rec .v{font-size:18px;font-weight:700;color:#136b39;margin-top:4px;letter-spacing:-.01em}
.exr-foot{display:flex;align-items:center;gap:22px;margin-top:16px}
.exr-conf{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;color:#137a41}
.exr-conf svg{width:18px;height:18px;stroke:var(--green);stroke-width:2.4;fill:none}
.exr-ev{font-size:15px;color:var(--text2)}
.exr-ev b{color:#33332f;font-weight:600}

/* ============================ OPENING (S0) =================== */
#opening{position:absolute;inset:0;background:#EFEFEC;overflow:hidden}
.desk{position:absolute;inset:0}
.paper-card{position:absolute;background:#fff;border:1px solid #E4E4DE;border-radius:14px;box-shadow:0 10px 30px rgba(20,20,25,.10);
  overflow:hidden;transform-origin:center}
.pc-h{height:34px;background:#fafafa;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 14px;
  font-size:12.5px;font-weight:700;color:#8a8a85;letter-spacing:.01em;gap:8px}
.pc-h .fi{width:13px;height:15px}
.pc-body{padding:0}
.gridrow{display:flex;height:26px;border-bottom:1px solid #f1f1ec;align-items:center;padding:0 12px;gap:0;font-size:11px;color:#7a7a75}
.gcell{flex:1;overflow:hidden;white-space:nowrap}
.gcell.n{text-align:right;color:#55554f;font-variant-numeric:tabular-nums;font-weight:600}
.gcell.red{color:var(--red);font-weight:700}
.exdot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 0 0 rgba(218,58,63,.5)}
.hl-red{background:var(--redbg)}
.op-cap{position:absolute;left:0;right:0;top:50%;text-align:center;z-index:20;pointer-events:none;padding:40px 0;
  background:radial-gradient(ellipse 760px 130px at 50% 50%, rgba(239,239,236,.96) 42%, rgba(239,239,236,0) 100%)}
.op-cap .t{font-size:60px;font-weight:700;letter-spacing:-.035em;color:#1a1a1d;display:inline-block}
.op-cap .t .accent{color:var(--text3)}

/* ============================ BRAND / FINAL ================= */
#brand{position:absolute;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-direction:row;gap:34px}
#brand .mark{width:150px;height:150px;position:relative}
#brand .wm{font-size:104px;font-weight:600;letter-spacing:-.03em;color:#0A0A0A;overflow:hidden;white-space:nowrap}

#final{position:absolute;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-direction:column}
.fin-wrap{text-align:center;position:relative}
.fin-1{font-size:64px;font-weight:700;letter-spacing:-.035em;color:#141417;line-height:1.12}
.fin-1 .muted{color:var(--text3)}
.fin-brand{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:0}

/* ----------------------------- math utils ----------------------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t);return t*t*(3-2*t);};
const smoother=t=>{t=clamp(t);return t*t*t*(t*(t*6-15)+10);};
const easeOut=t=>{t=clamp(t);return 1-Math.pow(1-t,3);};
const easeOutQuint=t=>{t=clamp(t);return 1-Math.pow(1-t,5);};
const easeInOut=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeOutBack=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
// progress within [a,b]
const seg=(t,a,b)=>clamp((t-a)/(b-a));
// fade envelope: 0 before ta, ramps in over fin, 1, ramps out over fout ending tb
function env(t,ta,tb,fin=.45,fout=.45){
  if(t<=ta||t>=tb) return 0;
  const up=clamp((t-ta)/fin);
  const dn=clamp((tb-t)/fout);
  return smooth(Math.min(up,dn));
}

/* ----------------------------- Vert mark ------------------------------- */
// Deltoid-style vortex: spokes from a central rounded triangle to the outer circle, twisted.
// The Vert mark: an aperture / iris — a solid rounded triangle (vertex up) with
// straight hatch lines tangent to its edges swirling out to a circle (3-fold pinwheel).
function drawMark(canvas, size, color, reveal=1, spin=0){
  const dpr=2;
  if(canvas._w!==size){ canvas.width=size*dpr; canvas.height=size*dpr; canvas.style.width=size+'px'; canvas.style.height=size+'px'; canvas._w=size; }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);
  const cx=size/2, cy=size/2, R=size*0.47;
  const N=clamp(Math.round(size*0.85)+60,90,260)|0;   // line count scales with size
  const s=R*0.48, b=0.16, phi0=-Math.PI/2, dir=-1;    // triangle scale / roundness / vertex up / swirl
  const lw=clamp(size*0.0042,0.55,1.0);
  const rw=clamp(size*0.006,0.9,2.4);
  const rev=clamp(reveal);
  const shown=Math.round(N*rev);
  const triScale=smooth(clamp((rev-0.12)/0.88));       // triangle grows in after the hatch
  const Pr=phi=>{const r=1+b*Math.cos(3*(phi-phi0));return [s*r*Math.cos(phi),s*r*Math.sin(phi)];};
  const Tr=phi=>{const r=1+b*Math.cos(3*(phi-phi0)),dr=-3*b*Math.sin(3*(phi-phi0));
    return [s*(dr*Math.cos(phi)-r*Math.sin(phi)), s*(dr*Math.sin(phi)+r*Math.cos(phi))];};
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(spin);
  ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.clip();
  // hatch: tangent rays from the triangle edge out to the circle
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='butt';
  for(let i=0;i<shown;i++){
    const phi=i/N*Math.PI*2;
    let [px,py]=Pr(phi); let [tx,ty]=Tr(phi);
    const tl=Math.hypot(tx,ty); tx=tx/tl*dir; ty=ty/tl*dir;
    const pt=px*tx+py*ty, pp=px*px+py*py, disc=pt*pt-(pp-R*R);
    if(disc<0) continue;
    const u=-pt+Math.sqrt(disc); if(u<=0) continue;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+u*tx,py+u*ty); ctx.stroke();
  }
  // solid rounded triangle
  if(triScale>0.02){
    ctx.beginPath();
    for(let i=0;i<=240;i++){ const phi=i/240*Math.PI*2; const [px,py]=Pr(phi);
      const x=px*triScale, y=py*triScale;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  }
  ctx.restore();
  // outer ring
  ctx.save();
  ctx.globalAlpha=clamp(rev*2);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.strokeStyle=color; ctx.lineWidth=rw; ctx.stroke();
  ctx.restore();
}
function mountMark(el,size,color){
  const c=document.createElement('canvas'); el.appendChild(c);
  drawMark(c,size,color); return c;
}

const DESK_CARDS=[
  {x:70,y:120,w:520,h:360,rot:-4,title:'AR_Aging_March.xlsx',type:'aging'},
  {x:640,y:80,w:470,h:300,rot:3,title:'Bank_Transactions.csv',type:'bank'},

];
function deskRow(cells,opts={}){
  const r=el('div','gridrow'+(opts.red?' hl-red':''));
  cells.forEach(c=>{
    const cell=el('div','gcell'+(c.n?' n':'')+(c.red?' red':''));
    cell.textContent=c.t;
    r.appendChild(cell);
  });
  if(opts.dot){const d=el('div','exdot');d.style.marginLeft='8px';r.appendChild(d);}
  return r;
}
function buildDesk(){
  const desk=$('#desk');
  const rnd=(seed)=>{ // deterministic pseudo-random
    let x=Math.sin(seed*127.1)*43758.5453; return x-Math.floor(x);
  };
  let sc=0;
  DESK_CARDS.forEach((cd,ci)=>{
    const card=el('div','paper-card');
    card.style.cssText=`left:${cd.x}px;top:${cd.y}px;width:${cd.w}px;height:${cd.h}px;transform:rotate(${cd.rot}deg)`;
    card.dataset.rot=cd.rot; card.dataset.cx=cd.x+cd.w/2; card.dataset.cy=cd.y+cd.h/2;
    card.appendChild(el('div','pc-h',ic('sheet','fi')+cd.title));
    const body=el('div','pc-body');
    const nrows=Math.floor((cd.h-34)/26);
    for(let i=0;i<nrows;i++){
      const isRed=(rnd(sc*3.3+i*1.7+ci)>0.72);
      const a=('INV-'+(1000+Math.floor(rnd(sc+i)*900)));
      const amt='$'+(Math.floor(rnd(sc*2+i*5)*90000)/100).toFixed(2);
      const bal='$'+(Math.floor(rnd(sc*7+i*2)*40000)/100).toFixed(2);
      const cells=[{t:a},{t:['Northwind','Brevard','Caraway','Sable Creek','ABC Pty'][Math.floor(rnd(i+ci)*5)]},
        {t:amt,n:true},{t:bal,n:true,red:isRed}];
      body.appendChild(deskRow(cells,{red:isRed,dot:isRed}));
      sc++;
    }
    card.appendChild(body);
    desk.appendChild(card);
  });
}

/* cache nodes */
const N_shell=$('#shell'), N_open=$('#opening'), N_brand=$('#brand'), N_final=$('#final');
const N_cmd=$('#ws-command'), N_clar=$('#ws-clarify'), N_plan=$('#ws-plan'), N_recon=$('#ws-recon'), N_audit=$('#ws-audit');
const deskCards=[...document.querySelectorAll('.paper-card')];

/* ============================ TIMELINE ============================ */
// scene windows (seconds)
const T={
  open:[0.0,5.4], brand:[4.7,6.6], cmd:[6.3,11.6], clar:[11.6,17.6],
  plan:[17.6,27.2], recon:[27.2,37.2], audit:[37.2,43.2], final:[43.0,45.0]
};

function setLayer(node,op,extra){ node.style.opacity=op; node.style.display=op<=0.001?'none':'';
  if(extra) node.style.transform=extra; }

let lastT=-1;
function render(t){
  t=clamp(t,0,DUR);
  window._t=t;

  /* ---------- OPENING (S0) ---------- */
  const oOp=env(t,T.open[0]-0.01,T.open[1],0.35,0.6);
  setLayer(N_open,oOp);
  if(oOp>0){
    // gentle drift + red dot pulse
    const drift=t;
    deskCards.forEach((c,i)=>{
      const rot=+c.dataset.rot;
      const dx=Math.sin(drift*0.5+i*1.3)*5;
      const dy=Math.cos(drift*0.45+i*0.9)*5;
      // collapse toward center at end
      const col=smoother(seg(t,4.0,5.2));
      const cx=+c.dataset.cx, cy=+c.dataset.cy;
      const toCx=960-cx, toCy=540-cy;
      const sx=lerp(0,toCx,col), sy=lerp(0,toCy,col);
      const scl=lerp(1,0.04,col);
      const rr=lerp(rot,rot+ (i%2?18:-18),col);
      c.style.transform=`translate(${dx+sx}px,${dy+sy}px) rotate(${rr}deg) scale(${scl})`;
      c.style.opacity=(1-col*0.9).toFixed(3);
    });
    // exception dots pulse
    const pulse=0.5+0.5*Math.sin(t*4.2);
    document.querySelectorAll('.exdot').forEach((d,i)=>{
      const p=0.5+0.5*Math.sin(t*4.2+i*0.6);
      d.style.boxShadow=`0 0 0 ${(p*5).toFixed(1)}px rgba(218,58,63,${(0.28*(1-p)).toFixed(2)})`;
    });
    // caption
    const cap=$('#opcap'); const cop=env(t,0.9,4.2,0.7,0.8);
    cap.style.opacity=cop;
    const cy2=lerp(18,0,easeOut(seg(t,0.9,1.9)));
    cap.style.transform=`translateY(${-cy2}px)`;
    cap.querySelector('.t').style.transform=`scale(${lerp(0.965,1,easeOut(seg(t,0.9,2.2)))})`;
  }

  /* ---------- BRAND (S1) ---------- */
  const bOp=env(t,T.brand[0],T.brand[1],0.4,0.5);
  setLayer(N_brand,bOp);
  if(bOp>0){
    const rev=easeOut(seg(t,T.brand[0],T.brand[0]+0.9));
    const spin=lerp(-0.5,0,easeOut(seg(t,T.brand[0],T.brand[0]+1.1)));
    drawMark(window._brandMark,150,'#0A0A0A',rev,spin);
    const wmClip=easeOut(seg(t,T.brand[0]+0.5,T.brand[0]+1.2));
    $('#brandWm').style.width=(wmClip*250)+'px';
    $('#brandWm').style.opacity=wmClip;
    // subtle scale settle + exit lift
    const s=lerp(0.9,1,easeOutBack(seg(t,T.brand[0],T.brand[0]+0.9)));
    const exit=seg(t,T.brand[1]-0.5,T.brand[1]);
    N_brand.style.transform=`scale(${s*lerp(1,1.04,exit)})`;
  }

  /* ---------- SHELL visibility ---------- */
  const shellOp=env(t,T.cmd[0]-0.2,T.final[0]+0.25,0.5,0.5);
  setLayer(N_shell,shellOp);

  /* camera (cinematic zoom during recon) */
  let camS=1,camX=0,camY=0;
  if(t>=T.recon[0]&&t<T.recon[1]){
    const z=seg(t,27.4,30.5), z2=seg(t,34.5,37.2);
    camS=lerp(1,1.10,smooth(z))*lerp(1,1/1.06,smooth(z2));
    camX=lerp(0,-70,smooth(z))*lerp(1,0.4,smooth(z2));
    camY=lerp(0,-24,smooth(z));
  }
  if(shellOp>0){
    N_shell.style.transform=`translate(${camX}px,${camY}px) scale(${camS})`;
  }

  /* ---------- COMMAND (S2) ---------- */
  const cmdOp=env(t,T.cmd[0],T.plan[0]+0.3,0.4,0.5);
  setLayer(N_cmd,cmdOp);
  if(cmdOp>0) updateCommand(t);

  /* ---------- CLARIFY (S3) ---------- */
  const clarOp=env(t,T.clar[0],T.plan[0]+0.35,0.45,0.5);
  setLayer(N_clar,clarOp);
  if(clarOp>0) updateClarify(t);

  /* ---------- PLAN (S4) ---------- */
  const planOp=env(t,T.plan[0],T.recon[0]+0.3,0.45,0.5);
  setLayer(N_plan,planOp);
  if(planOp>0) updatePlan(t);

  /* ---------- RECON (S5) ---------- */
  const recOp=env(t,T.recon[0],T.audit[0]+0.3,0.45,0.5);
  setLayer(N_recon,recOp);
  if(recOp>0) updateRecon(t);

  /* ---------- AUDIT (S6) ---------- */
  const audOp=env(t,T.audit[0],T.final[0]+0.25,0.45,0.4);
  setLayer(N_audit,audOp);
  if(audOp>0) updateAudit(t);

  /* ---------- FINAL (S7) ---------- */
  const finOp=env(t,T.final[0],DUR+0.5,0.6,0.5);
  setLayer(N_final,finOp);
  if(finOp>0) updateFinal(t);

  /* topbar / greet subtle intro */
  $('#topbar').style.opacity=env(t,T.cmd[0]+0.1,T.final[0],0.5,0.4);
}

/* ------------------------- scene updaters ------------------------- */
function updateCommand(t){
  // typing
  const typeStart=T.cmd[0]+0.5, typeEnd=T.cmd[0]+3.1;
  const p=seg(t,typeStart,typeEnd);
  const n=Math.floor(easeOut(p)*PROMPT.length);
  const shown=PROMPT.slice(0,n);
  const done=n>=PROMPT.length;
  const caret = (t<typeEnd+0.4 && (Math.floor(t*1.6)%2===0)) ? '<span class="cmd-caret"></span>' : '';
  const ph = shown.length? '' : '<span class="ph">Ask anything about your financial close…</span>';
  $('#cmdText').innerHTML = (shown||ph)+caret;
  // send button press at end of typing
  const press=seg(t,typeEnd+0.05,typeEnd+0.35);
  const sc=lerp(1,0.86,Math.sin(press*Math.PI));
  $('#cmdSend').style.transform=`translateY(-50%) scale(${sc})`;

  // thinking appears after submit
  const thinkStart=typeEnd+0.45;
  const th=$('#think'); th.style.opacity=env(t,thinkStart,T.plan[0],0.4,0.4);
  // fade the search a touch as we move to thinking
  $('.cmd-search').style.opacity=lerp(1,0.5,smooth(seg(t,thinkStart+0.3,thinkStart+1.0)));
  $('.cmd-tabs').style.opacity=lerp(1,0.0,smooth(seg(t,thinkStart+0.2,thinkStart+0.8)));

  // orb spin
  drawMark(window._orbCanvas,44,'#141414',1,(t-thinkStart)*1.4);

  // status lines cycle
  const lines=[['Understanding request','Vert is parsing your close data'],
               ['Loading company context','Reading AR ledger, customers & prior close'],
               ['Preparing reconciliation workflow','Assembling a controlled execution plan']];
  const phase=clamp(Math.floor(seg(t,thinkStart+0.2,T.clar[0]-0.2)*3),0,2);
  $('#thinkLine').textContent=lines[phase][0];
  $('#thinkSub').textContent=lines[phase][1];
  // steps completion
  const steps=[...document.querySelectorAll('#thinkSteps .tstep')];
  steps.forEach((s,i)=>{
    const doneAt=thinkStart+0.5+i*0.85;
    s.classList.toggle('done', t>=doneAt);
    s.style.opacity=env(t,thinkStart+0.1+i*0.2,T.plan[0],0.35,0.4);
  });
}

function updateClarify(t){
  const cards=[...document.querySelectorAll('#ws-clarify .qcard')];
  const base=T.clar[0]+0.35;
  cards.forEach((card,qi)=>{
    const appear=base+qi*1.35;
    const o=env(t,appear,T.plan[0],0.4,0.45);
    card.style.opacity=o;
    const y=lerp(24,0,easeOut(seg(t,appear,appear+0.6)));
    card.style.transform=`translateY(${y}px)`;
    // select correct option
    const selectAt=appear+0.85;
    const opts=[...card.querySelectorAll('.opt')];
    opts.forEach(op=>{
      const isSel=op.dataset.sel==='1';
      op.classList.toggle('sel', isSel && t>=selectAt);
    });
  });
  // modal subtle entrance
  const m=$('#ws-clarify .modal');
  const mo=easeOut(seg(t,T.clar[0],T.clar[0]+0.5));
  m.style.transform=`translateY(${lerp(16,0,mo)}px) scale(${lerp(0.985,1,mo)})`;
  // gentle auto-scroll so Q3 comes into view
  const scrollP=smooth(seg(t,14.0,16.8));
  $('#clarInner').style.transform=`translateY(${lerp(0,-238,scrollP)}px)`;
}

function updatePlan(t){
  const m=$('#ws-plan .modal');
  const mo=easeOutBack(seg(t,T.plan[0],T.plan[0]+0.6));
  m.style.transform=`translateY(${lerp(26,0,clamp(mo))}px) scale(${lerp(0.97,1,clamp(mo))})`;

  // sources connect
  const srcs=[...document.querySelectorAll('#planSrc .src')];
  srcs.forEach((s,i)=>{

function loop(now){
  if(playing){
    const t=(startT+(now-startWall)/1000);
    if(t>=DUR){ render(DUR); playing=false; }
    else { render(t); requestAnimationFrame(loop); }
  }
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(playing){ playing=false; }
    else { playing=true; startWall=performance.now(); startT=(window._t>=DUR?0:window._t); requestAnimationFrame(loop); }
  }
});
document.body.addEventListener('click',()=>{ if(!playing){ playing=true; startWall=performance.now(); startT=(window._t>=DUR?0:window._t); requestAnimationFrame(loop);} else playing=false;});
window.__ready=true;
</script>
</body>
</html>
